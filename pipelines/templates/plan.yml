parameters:
  - name: terraformVersion
    type: string

  - name: azureServiceConnection
    type: string

  - name: workingDirectory
    type: string

  - name: keyVaultName
    type: string

  - name: infracostSecretName
    type: string

stages:
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Validate

  jobs:
  - job: Plan
    displayName: "Terraform Plan"

    steps:

    - checkout: self
      clean: true

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: ${{ parameters.terraformVersion }}

    - task: Cache@2
      displayName: Cache Terraform Providers
      inputs:
        key: 'terraform | "$(Agent.OS)" | ${{ parameters.workingDirectory }}/.terraform.lock.hcl'
        restoreKeys: |
          terraform | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.terraform.d/plugin-cache

    - script: |
        mkdir -p $(Pipeline.Workspace)/.terraform.d/plugin-cache

        cat > ~/.terraformrc <<EOF
        plugin_cache_dir = "$(Pipeline.Workspace)/.terraform.d/plugin-cache"
        EOF
      displayName: Configure Terraform Plugin Cache


    - task: AzureCLI@2
      displayName: Terraform Init
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: ${{ parameters.workingDirectory }}
        inlineScript: |
          terraform init \
            -reconfigure \
            -backend-config=backend.hcl \
            -input=false

    - task: AzureKeyVault@2
      displayName: Retrieve Secrets
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        KeyVaultName: ${{ parameters.keyVaultName }}
        SecretsFilter: ${{ parameters.infracostSecretName }}
        RunAsPreJob: false

    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: ${{ parameters.workingDirectory }}
        inlineScript: |
          terraform plan \
            -lock=true \
            -out=tfplan.binary

    - script: |
        terraform show -json tfplan.binary > plan.json
      displayName: Export JSON Plan
      workingDirectory: ${{ parameters.workingDirectory }}

    - script: |
        curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh -s -- -v latest
        infracost --version
      displayName: Install Infracost
      continueOnError: true
    - script: |
        infracost scan plan.json || echo "Infracost estimate failed; continuing without blocking Terraform plan artifacts."
      displayName: Infracost Cost Estimate
      workingDirectory: ${{ parameters.workingDirectory }}
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: $(INFRACOST-API-KEY)

    - script: |
        curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh -s -- -v latest
        infracost --version
      displayName: 'Install Infracost'

    - script: |
        infracost breakdown --path plan.json || echo "Infracost estimate failed; continuing without blocking Terraform plan artifacts."
      displayName: 'Infracost Cost Estimate'
      workingDirectory: ${{ parameters.workingDirectory }}
      env:
        INFRACOST_CLI_AUTHENTICATION_TOKEN: $(INFRACOST-API-KEY)

    - publish: ${{ parameters.workingDirectory }}/tfplan.binary
      artifact: terraform-plan

    - publish: ${{ parameters.workingDirectory }}/plan.json
      artifact: terraform-plan-json
