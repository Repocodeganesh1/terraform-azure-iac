trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.6.6'

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: '$(terraformVersion)'

  - script: |
      terraform -version
      terraform init
      terraform validate
    displayName: 'Validate Terraform'
