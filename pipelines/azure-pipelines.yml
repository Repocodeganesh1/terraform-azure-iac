steps:
  - checkout: self

  - task: TerraformInstaller@1
    inputs:
      terraformVersion: '$(terraformVersion)'

  - script: |
      terraform init
      terraform validate
    displayName: 'Terraform Validate'
    workingDirectory: bootstrap   # 👈 run inside bootstrap folder

  - task: AzureKeyVault@2
    inputs:
      azureSubscription: 'bootstrap'
      KeyVaultName: '$(keyVaultName)'
      SecretsFilter: 'INFRACOST_CLI_AUTHENTICATION_TOKEN'
    workingDirectory: bootstrap

  - script: |
      curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh
      terraform plan -out tfplan.binary
      terraform show -json tfplan.binary > plan.json
      infracost scan --path plan.json \
        --api-key $(INFRACOST_CLI_AUTHENTICATION_TOKEN) \
        --format table
    displayName: 'Infracost Estimate'
    workingDirectory: bootstrap

  - script: terraform apply -auto-approve
    displayName: 'Terraform Apply'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    workingDirectory: bootstrap
