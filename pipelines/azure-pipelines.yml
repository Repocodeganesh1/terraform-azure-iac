trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  keyVaultName: 'kv-ht-boot-cin-01'
  secretName: 'INFRACOST_CLI_AUTHENTICATION_TOKEN'

steps:
# Checkout repo
- checkout: self

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: '$(terraformVersion)'

# Clean cache to avoid stale providers
- script: |
    cd bootstrap
    rm -rf .terraform .terraform.lock.hcl
  displayName: 'Clean Terraform cache'

# Authenticate to Azure and run init/validate
- task: AzureCLI@2
  inputs:
    azureSubscription: 'bootstrap'   # Service connection name
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      terraform init -backend-config=backend.hcl
      terraform validate
  displayName: 'Terraform Init & Validate'

# Fetch Infracost token securely from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'bootstrap'
    KeyVaultName: '$(keyVaultName)'
    SecretsFilter: '$(secretName)'

# Infracost estimate (plan + cost scan)
- task: AzureCLI@2
  inputs:
    azureSubscription: 'bootstrap'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
      terraform plan -out tfplan.binary
      terraform show -json tfplan.binary > plan.json
      infracost breakdown --path plan.json \
        --api-key $(INFRACOST_CLI_AUTHENTICATION_TOKEN) \
        --format table
  displayName: 'Infracost Estimate'

# Apply only on main branch
- task: AzureCLI@2
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  inputs:
    azureSubscription: 'bootstrap'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      terraform apply -auto-approve tfplan.binary
  displayName: 'Terraform Apply'
