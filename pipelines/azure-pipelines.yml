trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - name: terraformVersion
    value: '1.15.0'

  - name: azureServiceConnection
    value: 'bootstrap'

  - name: workingDirectory
    value: 'environments/bootstrap'

  - name: keyVaultName
    value: 'kv-ht-boot-cin-01'

  - name: infracostSecretName
    value: 'INFRACOST-API-KEY'

pool:
  vmImage: ubuntu-latest

stages:

- template: templates/validate.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)

- template: templates/plan.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)
    keyVaultName: $(keyVaultName)
    infracostSecretName: $(infracostSecretName)

- template: templates/apply.yml
  parameters:
    terraformVersion: $(terraformVersion)
    azureServiceConnection: $(azureServiceConnection)
    workingDirectory: $(workingDirectory)