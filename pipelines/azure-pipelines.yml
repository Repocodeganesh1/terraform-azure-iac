trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  keyVaultName: 'kv-ht-boot-cin-01'
  secretName: 'INFRACOST-API-KEY'

steps:
- checkout: self

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: '$(terraformVersion)'

# Clean cache
- script: |
    cd bootstrap
    rm -rf .terraform .terraform.lock.hcl
  displayName: 'Clean Terraform cache'

# Init + validate with Azure auth
- task: AzureCLI@2
  inputs:
    azureSubscription: 'bootstrap'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      terraform init -backend-config=backend.hcl
      terraform validate
  displayName: 'Terraform Init & Validate'

# Fetch Infracost API key securely from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'bootstrap'
    KeyVaultName: '$(keyVaultName)'
    SecretsFilter: '$(secretName)'

# Infracost estimate (plan + scan)
# Infracost estimate (plan + scan)
- task: AzureCLI@2
  inputs:
    azureSubscription: 'bootstrap'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      # Install latest Infracost
      curl -fsSL https://raw.githubusercontent.com/infracost/cli/master/scripts/install.sh | sh

      # Run Terraform plan
      terraform plan -out tfplan.binary
      terraform show -json tfplan.binary > plan.json

      # Export API key from Key Vault secret
      export INFRACOST_API_KEY=$(INFRACOST-API-KEY)

      # Run Infracost scan
      infracost scan --path plan.json --format table
  displayName: 'Infracost Estimate'


# Apply only on main branch
- task: AzureCLI@2
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  inputs:
    azureSubscription: 'bootstrap'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      cd bootstrap
      terraform apply -auto-approve tfplan.binary
  displayName: 'Terraform Apply'
