trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.15.8'
  keyVaultName: 'kv-ht-boot-cin-01'
  secretName: 'INFRACOST_CLI_AUTHENTICATION_TOKEN'

steps:
# Checkout repo
- checkout: self

# Install Terraform
- task: TerraformInstaller@1
  inputs:
    terraformVersion: '$(terraformVersion)'

# Terraform init + validate (always runs)
- script: |
    terraform init -backend-config=bootstrap/backend.hcl
    terraform validate
  displayName: 'Terraform Validate'
  workingDirectory: $(System.DefaultWorkingDirectory)/bootstrap

# Fetch Infracost token securely from Key Vault
- task: AzureKeyVault@2
  inputs:
    azureSubscription: 'bootstrap'
    KeyVaultName: '$(keyVaultName)'
    SecretsFilter: '$(secretName)'

# Infracost estimate
- script: |
    curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
    terraform plan -out tfplan.binary
    terraform show -json tfplan.binary > plan.json
    infracost scan --path plan.json \
      --api-key $(INFRACOST_CLI_AUTHENTICATION_TOKEN) \
      --format table
  displayName: 'Infracost Estimate'
  workingDirectory: $(System.DefaultWorkingDirectory)/bootstrap

# Apply only on main branch
- script: |
    terraform apply -auto-approve
  displayName: 'Terraform Apply'
  workingDirectory: $(System.DefaultWorkingDirectory)/bootstrap
